  function wireMaster() {
    const tb = $('#mTable'); if (!tb) return;
    const apply = () => {
      const q = CT.norm($('#mSearch').value); const f = $('#mFilter').value;
      $$('#mTable tbody tr').forEach((tr) => {
        const left = tr.querySelector('[data-ms]').value === 'left'; const hid = tr.dataset.hidden === '1';
        const un = !tr.querySelector('[data-mb]').value;
        let show = f === 'removed' ? hid : !hid && (f === 'all' || (f === 'left' ? left : !left && (f !== 'unassigned' || un)));
        if (q && !tr.dataset.name.includes(q)) show = false;
        tr.style.display = show ? '' : 'none';
      });
    };
    $('#mSearch').oninput = apply; $('#mFilter').onchange = apply;
    tb.addEventListener('change', (e) => {
      if (!e.target.matches('[data-ms]')) return;
      const tr = e.target.closest('tr'); const left = e.target.value === 'left';
      tr.querySelector('[data-ml]').disabled = !left; tr.querySelector('[data-rm]').hidden = !left;
      if (!left) { tr.dataset.hidden = ''; tr.querySelector('[data-rs]').hidden = true; }

    apply();

  async function saveSettingsNow(base) { try { const saved = await Store.saveSettings(App.settings, base); App.settings = Object.assign(CT.defaultSettings(), saved); recomputeAll(); render(); closeModal(); toast('Settings saved and the review recalculated.'); } catch (e) { toast(e.message, true); } }
  /* PDF of the deck: each slide captured at 1280 x 720 and saved through the viewer's download prompt

  const loadScript = (src) => new Promise((res, rej) => { if (document.querySelector(`script[src="${src}"]`)) { res(); return; } const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('could not load the PDF tools')); document.head.appendChild(el); });
  async function saveFile(filename, data, mime) {
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (dl) { await dl.save({ filename, data }); return true; }
    } catch (e) {
      if (e && e.code === 'declined') return false;
      if (e && e.code && !['unavailable', 'not_granted', 'capability_disabled', 'capability_removed'].includes(e.code)) { toast('Download was not completed (' + e.code + ').', true); return false; }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type: mime })); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    return true;
  }
  let pdfBusy = false;
  async function downloadPdf() {
    if (pdfBusy) return; pdfBusy = true;
    const btn = $('#btnPrint'); const label = btn.textContent; btn.disabled = true; btn.textContent = 'Preparing PDF…';
    let host = null;
    try {
      const slides = [...document.querySelectorAll('#deck .frame > .slide')];
      if (!slides.length) { toast('There are no slides to export for this month.', true); return; }
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
      await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
      host = document.createElement('div'); host.setAttribute('aria-hidden', 'true');
      host.style.cssText = 'position:absolute;left:-30000px;top:0;width:1280px;height:720px;overflow:hidden;pointer-events:none';
      document.body.appendChild(host);
      const { jsPDF } = window.jspdf; const pdf = new jsPDF({ orientation: 'landscape', unit: 'px', format: [1280, 720], hotfixes: ['px_scaling'], compress: true });
      for (let i = 0; i < slides.length; i++) {
        btn.textContent = `PDF: slide ${i + 1} of ${slides.length}`;
        const c = slides[i].cloneNode(true); c.style.transform = 'none'; host.replaceChildren(c);
        const canvas = await window.html2canvas(c, { scale: 1.5, backgroundColor: '#ffffff', logging: false, width: 1280, height: 720, windowWidth: 1280, windowHeight: 720 });
        if (i) pdf.addPage([1280, 720], 'landscape');
        pdf.addImage(canvas.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, 1280, 720, undefined, 'FAST');
      }
      const filename = `Shaji_KPI_Review_${CT.monthLabel(App.review, true).replace(/\s+/g, '_')}.pdf`;
      btn.textContent = 'Saving PDF…';
      if (await saveFile(filename, pdf.output('blob'), 'application/pdf')) toast(`PDF of ${slides.length} slides ready: ${filename}`);
    } catch (e) { toast('The PDF could not be created: ' + (e && e.message ? e.message : e), true); }
    finally { if (host) host.remove(); btn.textContent = label; btn.disabled = false; pdfBusy = false; }
  }
  async function exportHistory() {

    const filename = `shaji-control-tower-history-${new Date().toISOString().slice(0, 10)}.json`;

      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;

  async function importHistory(file) {
    if (!file) return;
    try {
      const j = JSON.parse(await file.text());
      if (!j || !Array.isArray(j.months)) throw new Error('This file is not a Control Tower history export.');
      let n = 0;
      for (const md of j.months) {
        if (!md.month) continue;
        const ex = App.months[md.month]; let doc;
        if (ex && ex.locked) continue;
        if (!ex) doc = md;
        else { doc = clone(ex); doc.data = Object.assign({}, md.data || {}, doc.data || {}); if (!doc.manual || !Object.keys(doc.manual).length) doc.manual = md.manual || {}; if (!doc.baseSummary && (md.baseSummary || md.summary)) doc.baseSummary = md.baseSummary || md.summary; }
        if (doc.baseline && doc.summary && !doc.baseSummary) { doc.baseSummary = doc.summary; delete doc.summary; }
        await Store.saveMonth(doc); App.months[doc.month] = doc; n++;
      }
      if (j.employees) { App.master = Object.assign({}, j.employees, App.master); await Store.saveMaster(App.master); }
      if (j.settings && !App.settingsSaved) { App.settings = Object.assign(CT.defaultSettings(), j.settings); await Store.saveSettings(App.settings); }
      recomputeAll(); if (!App.review) App.review = reviewable()[0] || null; render(); closeModal(); toast(`Imported ${n} month${n === 1 ? '' : 's'}.`);
    } catch (e) { toast(e.message, true); }
  }

  }
  function showP() {
    const frames = $$('#deck .frame'); pIdx = Math.max(0, Math.min(frames.length - 1, pIdx));
    const st = $('#stage'); st.innerHTML = frames[pIdx].innerHTML;
    const sl = st.querySelector('.slide'); sl.style.transform = 'none';
    const k = Math.min(innerWidth / 1280, innerHeight / 720);
    st.style.transform = `translate(${(innerWidth - 1280 * k) / 2}px,${(innerHeight - 720 * k) / 2}px) scale(${k})`;
    $('#pCount').textContent = `${pIdx + 1} / ${frames.length}`;
  }
  function endP() { $('#present').hidden = true; if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); }

  });
  addEventListener('resize', () => { scaleDeck(); if (!$('#present').hidden) showP(); });

  /* ---------------- wiring & boot ---------------- */
  $('#brandLogo').src = LOGO_SHAJI; $('#assuredLogo').src = LOGO_ASSURED_LIGHT;
  /* author line sits at the bottom of the header bar, right edge aligned under the Present button */
  function placeAuthor() { const bar = document.querySelector('header.bar'); const p = $('#btnPresent'); const a = $('#authorLine'); if (!bar || !p || !a) return; const br = bar.getBoundingClientRect(); const pr = p.getBoundingClientRect(); if (!pr.width) return; a.style.right = Math.max(8, Math.round(br.right - pr.right)) + 'px'; }
  window.addEventListener('resize', placeAuthor);
  if (window.ResizeObserver) new ResizeObserver(placeAuthor).observe(document.querySelector('header.bar .ctrl'));
  $('#btnUpload').onclick = openUpload;
  $('#btnInputs').onclick = openInputs;
  $('#btnChecks').onclick = openChecks;
  $('#btnSettings').onclick = openSettings;
  $('#btnPresent').onclick = present;
  $('#btnLock').onclick = toggleLock;
  $('#btnPrint').onclick = downloadPdf;
  $('#monthSel').onchange = (e) => { App.review = e.target.value; render(); $('#main').scrollTop = 0; };
  $('#nav').addEventListener('click', (e) => { const a = e.target.closest('a'); if (!a) return; e.preventDefault(); const f = document.getElementById('f-' + a.dataset.id); if (f) f.scrollIntoView({ behavior: 'smooth', block: 'start' }); });
  if (window.ResizeObserver) new ResizeObserver(scaleDeck).observe($('#deck'));

  let remoteT = null;
  async function boot() {
    await Store.init();
    const d = await Store.load();
    App.months = d.months || {}; App.master = d.master || {};
    if (d.settings) { App.settings = Object.assign(CT.defaultSettings(), d.settings); App.settingsSaved = true; }
    $('#storePill').textContent = Store.mode === 'db' ? 'Shared history' : 'Saved in this browser';
    $('#storePill').title = Store.mode === 'db' ? 'Months, inputs and settings are stored centrally for everyone with access to this page.' : 'History is kept in this browser. Use Settings > History to export or import it.';
    if (Store.mode === 'excel') {
      const ctrl = document.querySelector('header.bar .ctrl'); const before = $('#btnSettings');
      const bOpen = document.createElement('button'); bOpen.className = 'btn'; bOpen.id = 'btnOpenData'; bOpen.textContent = 'Open data file'; bOpen.title = 'Load a Control Tower data workbook (.xlsx)';
      const bSave = document.createElement('button'); bSave.className = 'btn'; bSave.id = 'btnSaveData'; bSave.textContent = 'Save data to Excel'; bSave.title = 'Download all months, inputs, employees and settings as the data workbook';
      ctrl.insertBefore(bOpen, before); ctrl.insertBefore(bSave, before);
      const fi = document.createElement('input'); fi.type = 'file'; fi.accept = '.xlsx'; fi.hidden = true; document.body.appendChild(fi);
      bOpen.onclick = () => fi.click(); fi.onchange = () => { const f = fi.files[0]; fi.value = ''; if (f) openDataWorkbook(f); };
      bSave.onclick = saveDataWorkbook;
      updateExcelPill();
    }
    recomputeAll();
    const ms = reviewable(); App.review = ms.find((x) => App.months[x].data && Object.keys(App.months[x].data).length > 3) || ms[0] || null;
    render();
    App.sig = JSON.stringify(App.months);
    Store.subscribe((months) => {
      clearTimeout(remoteT);
      remoteT = setTimeout(() => {
        const sig = JSON.stringify(months); if (sig === App.sig) return; App.sig = sig; App.months = months;
        recomputeAll(); if (!App.review || !App.months[App.review]) App.review = reviewable()[0] || null;
        if ($('#modal').hidden) render();
      }, 500);
    });
  }
  boot().catch((e) => { console.error(e); $('#deck').innerHTML = `<div class="welcome"><h1>The review could not load</h1><p>${esc(e.message || e)}</p><p>Reload the page. If this persists, export the history from another browser and import it here.</p></div>`; });
})();

</script>
</body>
</html>
