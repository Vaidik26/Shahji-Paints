<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operations Control Tower | Shaji Paints UAE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --ink:#1C1756;--violet:#6D28D9;--lav:#C4B5FD;--mist:#F7F7FB;--rule:#E5E7EB;--slate:#4B5563;
  --good:#15803D;--warn:#C2410C;--bad:#B91C1C;
  --app-bg:#EEEDF5;--app-panel:#FFFFFF;--app-text:#1F1B3A;--app-muted:#5E5A78;--app-line:#DAD8E8;--app-bar:#1C1756;--app-accent:#6D28D9;--app-hover:#F1EDFC;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--app-bg:#12102A;--app-panel:#1B1838;--app-text:#ECEAF7;--app-muted:#A9A5C7;--app-line:#322E58;--app-bar:#0E0C24;--app-accent:#A78BFA;--app-hover:#26224A;color-scheme:dark}}
:root[data-theme="dark"]{--app-bg:#12102A;--app-panel:#1B1838;--app-text:#ECEAF7;--app-muted:#A9A5C7;--app-line:#322E58;--app-bar:#0E0C24;--app-accent:#A78BFA;--app-hover:#26224A;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;height:100%;background:var(--app-bg);color:var(--app-text);font:14px/1.45 Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--app-accent);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%}
.bar{background:var(--app-bar);color:#fff;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px 16px;padding:10px 18px 24px;position:relative}.author-line{position:absolute;bottom:6px;right:18px;font-size:11px;line-height:1;color:#C9C4EE;white-space:nowrap;pointer-events:none}.bar>.brand{grid-column:1;grid-row:1}.bar>.ctrl{grid-column:2;grid-row:1;justify-content:flex-end}.bar-logo{grid-column:3;grid-row:1;height:30px;width:auto;display:block;justify-self:end}
@media (max-width:1440px){.bar{grid-template-columns:auto 1fr}.bar-logo{grid-column:2;grid-row:1}.bar>.ctrl{grid-column:1 / -1;grid-row:2;justify-content:flex-start;margin-left:0}}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand img{height:30px}
.brand .b1{font-weight:700;font-size:16px;letter-spacing:.2px}
.brand .b2{font-size:12px;color:#C9C4EE}
.ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-left:auto}
.ctrl label{font-size:12px;color:#C9C4EE;display:flex;align-items:center;gap:6px}
.ctrl select{background:#2A2470;border:1px solid #4A42A0;color:#fff;border-radius:6px;padding:6px 8px}
.btn{background:transparent;border:1px solid #4A42A0;color:#fff;border-radius:6px;padding:6px 12px;white-space:nowrap}
.btn:hover{background:#2A2470}
.btn.primary{background:#6D28D9;border-color:#6D28D9}
.btn.primary:hover{background:#5B21B6}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:#F59E0B;color:#1C1756;font-size:11px;font-weight:700;margin-left:4px}
.pill{font-size:11px;color:#C9C4EE;border:1px solid #4A42A0;border-radius:10px;padding:2px 8px;white-space:nowrap}
.layout{flex:1;display:flex;min-height:0}
#nav{width:250px;flex:none;overflow:auto;background:var(--app-panel);border-right:1px solid var(--app-line);padding:12px 8px 40px}
#nav h4{margin:14px 10px 4px;font-size:11px;color:var(--app-muted);font-weight:700}
#nav a{display:block;padding:5px 10px;border-radius:6px;color:var(--app-text);text-decoration:none;font-size:13px;line-height:1.3}
#nav a:hover{background:var(--app-hover)}
#nav a.on{background:var(--app-hover);color:var(--app-accent);font-weight:700}
main{flex:1;overflow:auto;padding:24px}
#deck{max-width:1180px;margin:0 auto;--k:.9}
.frame{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;margin:0 0 22px;border-radius:4px;box-shadow:0 1px 3px rgba(28,23,86,.18);background:#fff}
.slide{position:absolute;left:0;top:0;width:1280px;height:720px;transform:scale(var(--k));transform-origin:0 0;background:#fff;color:var(--slate);overflow:hidden;font:14px/1.4 Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums}
.welcome{background:var(--app-panel);border:1px solid var(--app-line);border-radius:8px;padding:28px 32px;max-width:760px;margin:40px auto}
.welcome h1{margin:0 0 8px;font-size:22px}
.welcome ol{padding-left:20px}
.muted{color:var(--app-muted)}
@media (max-width:900px){#nav{display:none}main{padding:12px}.brand .b2{display:none}}

/* ---------- slide design (fixed light palette, deck style) ---------- */
.s-logo{position:absolute;right:36px;top:22px;height:30px}
.s-head{position:absolute;left:48px;top:30px;right:220px}
.s-kicker{font-size:12px;font-weight:700;color:var(--violet);letter-spacing:1px;margin-bottom:6px}
.s-head h2{margin:0;font-size:30px;line-height:1.15;color:var(--ink);font-weight:700}
.s-sub{margin:8px 0 0;font-size:13px;color:#6B7280;max-width:1000px}
.s-body{position:absolute;left:48px;right:48px;top:138px;bottom:46px}
.s-foot{position:absolute;left:48px;right:48px;bottom:14px;display:flex;justify-content:space-between;font-size:10.5px;color:#9CA3AF}
.slide.dark{background:var(--ink);color:#fff}
.slide.dark .s-foot{color:#8C86C9}
.dark-deco{position:absolute;border-radius:50%;background:#2A2470}
.cover-title{position:absolute;left:96px;top:250px;font-size:46px;font-weight:700;color:#fff}
.cover-lines{position:absolute;left:100px;top:326px;font-size:20px;line-height:1.7;color:#E4E1FA}
.cover-logo-l{position:absolute;left:36px;top:26px;height:42px}
.cover-logo-r{position:absolute;right:36px;top:26px;height:34px}
.div-title{position:absolute;left:96px;top:270px;font-size:40px;font-weight:700;color:#fff}
.div-sub{position:absolute;left:98px;top:330px;font-size:17px;color:#C9C4EE;max-width:900px}
.empty{position:absolute;inset:40px 80px;border:1.5px dashed #C4B5FD;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#4B5563;padding:30px}
.empty strong{color:var(--ink);font-size:18px;margin-bottom:8px}
table.t{border-collapse:collapse;width:100%;font-size:12.5px;color:#374151}
table.t th{background:var(--ink);color:#fff;font-weight:700;padding:7px 8px;text-align:right;font-size:11.5px;line-height:1.25;vertical-align:bottom}
table.t th.l,table.t td.l{text-align:left}
table.t td{padding:6px 8px;text-align:right;border-bottom:1px solid var(--rule)}
table.t tr:nth-child(even) td{background:var(--mist)}
table.t tr.tot td{font-weight:700;background:#EDE9FE;color:var(--ink)}
table.t td.strong{font-weight:700;color:var(--ink)}
table.t.sm{font-size:11.5px}table.t.sm td{padding:4.5px 6px}table.t.sm th{padding:6px 6px;font-size:10.5px}
.g{color:var(--good);font-weight:700}.a{color:var(--warn);font-weight:700}.r{color:var(--bad);font-weight:700}
.note{font-size:11px;color:#6B7280;margin-top:8px}
.cards{display:grid;gap:18px}
.card{border:1px solid var(--rule);border-radius:10px;background:#fff;padding:18px 20px;box-shadow:0 1px 2px rgba(28,23,86,.06)}
.card .lbl{font-size:11px;font-weight:700;color:#6B7280;letter-spacing:.6px}
.card .big{font-size:34px;font-weight:700;color:var(--ink);margin:14px 0 6px}
.card .sm{font-size:13px;color:#6B7280}
.hero{background:var(--ink);color:#fff;border-radius:12px;padding:24px}
.hero .lbl{font-size:11px;font-weight:700;letter-spacing:.8px;color:#C9C4EE}
.hero .big{font-size:52px;font-weight:700;margin:14px 0 8px}
.hero .sm{font-size:13px;color:#E4E1FA;line-height:1.5}
.mover{border:1px solid var(--rule);border-radius:10px;padding:14px 18px;margin-bottom:14px}
.mover .top{display:flex;justify-content:space-between;align-items:baseline}
.mover .nm{font-size:16px;font-weight:700;color:var(--ink)}
.mover .dl{font-size:22px;font-weight:700}
.mover .ln{font-size:12.5px;color:#6B7280;margin-top:6px}
.lb{border:1px solid var(--rule);border-radius:10px;padding:10px 14px;margin-bottom:9px;display:flex;align-items:center;gap:12px}
.lb.first{border:2px solid #A78BFA;background:#F5F3FF}
.lb .rk{font-size:17px;font-weight:700;color:var(--ink);width:22px}
.lb .who{flex:1;min-width:0}
.lb .who b{display:block;color:var(--ink);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb .who span{font-size:11.5px;color:#6B7280}
.lb .sc{text-align:right}
.lb .sc b{display:block;font-size:20px;color:var(--good)}
.lb .sc span{font-size:11px}
.podium{border:1px solid var(--rule);border-radius:10px;padding:14px 16px;margin-bottom:14px;display:flex;gap:14px;align-items:center}
.podium .medal{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#1C1756}
.podium.p1{border:2px solid #86EFAC;background:#F0FDF4}
.podium b{color:var(--ink);font-size:14px;display:block}
.podium .v{margin-left:auto;font-size:22px;font-weight:700;color:var(--good)}
.chart text{font-family:Arial,Helvetica,sans-serif}
.chart .ax{font-size:11.5px;fill:#6B7280}
.chart .vl{font-size:11px;fill:#374151;font-weight:700}
.chart .grid{stroke:#E5E7EB;stroke-width:1}
.legend{display:flex;gap:18px;font-size:12px;color:#4B5563;justify-content:center;margin-top:4px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-2px}
.tk{border-left:4px solid var(--violet);padding:4px 0 4px 16px;margin-bottom:22px}
.tk b{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}
.tk p{margin:0;font-size:14px;line-height:1.55;color:#374151}
.dq{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);font-size:13px;line-height:1.45;color:#374151}
.dq .lv{flex:none;width:64px;font-size:10.5px;font-weight:700;border-radius:4px;padding:3px 0;text-align:center;height:20px}
.dq .lv.high{background:#FEE2E2;color:#991B1B}.dq .lv.med{background:#FFEDD5;color:#9A3412}.dq .lv.info{background:#EDE9FE;color:#5B21B6}
.dq .ar{flex:none;width:150px;font-weight:700;color:var(--ink)}
.flag{display:inline-block;font-size:10px;font-weight:700;color:#9A3412;background:#FFEDD5;border-radius:3px;padding:1px 5px;margin-left:4px;vertical-align:1px}

/* ---------- modal ---------- */
#modal{position:fixed;inset:0;background:rgba(14,12,36,.55);display:flex;align-items:flex-start;justify-content:center;padding:4vh 16px;z-index:50;overflow:auto}
#modal[hidden]{display:none}
.mbox{background:var(--app-panel);color:var(--app-text);border-radius:10px;width:min(980px,100%);box-shadow:0 20px 50px rgba(0,0,0,.35);display:flex;flex-direction:column;max-height:92vh}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--app-line)}
.mhead h3{margin:0;font-size:18px}
.mbody{padding:18px 22px;overflow:auto}
.mfoot{padding:14px 22px;border-top:1px solid var(--app-line);display:flex;gap:10px;justify-content:flex-end;align-items:center}
.mbtn{border:1px solid var(--app-line);background:var(--app-panel);border-radius:6px;padding:7px 14px}
.mbtn:hover{background:var(--app-hover)}
.mbtn.primary{background:#6D28D9;border-color:#6D28D9;color:#fff}
.mbtn.primary:hover{background:#5B21B6}
.mbtn.danger{color:#B91C1C}
.mbtn:disabled{opacity:.5;cursor:not-allowed}
.x{background:none;border:0;font-size:22px;line-height:1;color:var(--app-muted)}
.drop{border:2px dashed var(--app-line);border-radius:10px;padding:24px;text-align:center}
.drop.over{border-color:var(--app-accent);background:var(--app-hover)}
.linkbtn{background:none;border:0;color:var(--app-accent);text-decoration:underline;padding:0}
.ft{border-collapse:collapse;width:100%;font-size:13px}
.ft th{text-align:left;font-size:11.5px;color:var(--app-muted);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--app-line)}
.ft td{padding:6px 8px;border-bottom:1px solid var(--app-line);vertical-align:middle}
.ft input[type=number],.ft input[type=text],.ft select{width:100%;max-width:130px;padding:5px 7px;border:1px solid var(--app-line);border-radius:5px;background:var(--app-bg)}
.ft input.wide{max-width:none}
.sec{margin:6px 0 22px}
.sec h4{margin:0 0 4px;font-size:15px}
.sec p.h{margin:0 0 10px;font-size:12.5px;color:var(--app-muted)}
.expect{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:6px 18px;font-size:12.5px;margin:12px 0 4px}
.expect div::before{content:"○ ";color:var(--app-muted)}
.expect div.ok::before{content:"✓ ";color:#16A34A;font-weight:700}
.status-ok{color:#16A34A;font-weight:700}.status-err{color:#DC2626;font-weight:700}
.field{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13.5px}
.field input[type=text],.field input[type=number],.field select{padding:5px 8px;border:1px solid var(--app-line);border-radius:5px;background:var(--app-bg)}
textarea.code{width:100%;min-height:140px;font:12px/1.4 Consolas,Menlo,monospace;padding:8px;border:1px solid var(--app-line);border-radius:6px;background:var(--app-bg)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1C1756;color:#fff;padding:10px 18px;border-radius:8px;font-size:13.5px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:90vw}
#toast[hidden]{display:none}
#toast.warn{background:#9A3412}
#lockPill{border-color:#86EFAC;color:#BBF7D0}
.lockbar{background:#F0FDF4;border:1px solid #86EFAC;color:#14532D;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:13px}
/* ---------- presenter ---------- */
#present{position:fixed;inset:0;background:#0B0A1E;z-index:70}
#present[hidden]{display:none}
#present .stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0}
#present .pc{position:absolute;right:16px;bottom:12px;color:#8C86C9;font-size:12px}
#present .px{position:absolute;right:14px;top:10px;background:none;border:0;color:#8C86C9;font-size:26px}
/* ---------- print ---------- */
@page{size:1280px 720px;margin:0}
@media print{
  html,body{height:auto;background:#fff}
  .bar,#nav,#modal,#toast,#present{display:none!important}
  .layout{display:block}main{padding:0;overflow:visible}
  #deck{max-width:none;margin:0}
  .frame{width:1280px;height:720px;aspect-ratio:auto;margin:0;box-shadow:none;border-radius:0;break-after:page;page-break-after:always}
  .slide{transform:none}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
#cfm{position:fixed;inset:0;z-index:10000}#cfm[hidden]{display:none}.cfm-back{position:absolute;inset:0;background:rgba(20,16,60,.45)}.cfm-box{position:relative;max-width:500px;margin:16vh auto 0;background:var(--card,#fff);color:var(--ink,#1B1464);border-radius:12px;padding:20px 22px;box-shadow:0 18px 50px rgba(20,16,60,.3);font-size:14px;line-height:1.5}.cfm-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.pill.warn{background:#FDE7C7;color:#7A4A00;border-color:#F2B45A}
</style>
</head>
<body>
<div id="app">
  <header class="bar">
    <div class="brand"><img alt="Shaji" id="brandLogo"><div><div class="b1">Operations Control Tower</div><div class="b2">Shaji Paints UAE monthly KPI review</div></div></div>
    <div class="ctrl">
      <label>Review month <select id="monthSel" aria-label="Review month"></select></label>
      <span class="pill" id="lockPill" hidden></span>
      <button class="btn" id="btnLock" hidden>Lock month</button>
      <button class="btn primary" id="btnUpload">Upload data</button>
      <button class="btn" id="btnInputs">Monthly inputs</button>
      <button class="btn" id="btnChecks">Data checks <span class="badge" id="dqBadge" hidden></span></button>
      <button class="btn" id="btnSettings">Settings</button>
      <button class="btn" id="btnPresent">Present</button>
      <button class="btn" id="btnPrint" title="Download the deck as a PDF (one page per slide)">Download PDF</button>
      <span class="pill" id="storePill">Loading…</span>
    </div>
    <img id="assuredLogo" class="bar-logo" alt="Assured Grow Consultancy LLC">
    <div id="authorLine" class="author-line">Author: Leonard Amanna_AGC</div>
  </header>
  <div class="layout">
    <nav id="nav" aria-label="Slides"></nav>
    <main id="main"><div id="deck"><div class="welcome"><h1>Loading review data…</h1><p class="muted">Connecting to the shared review history.</p></div></div></main>
  </div>
</div>
<div id="modal" hidden><div class="mbox" role="dialog" aria-modal="true"><div class="mhead"><h3 id="mTitle"></h3><button class="x" id="mClose" aria-label="Close">×</button></div><div class="mbody" id="mBody"></div><div class="mfoot" id="mFoot"></div></div></div>
<div id="present" hidden><div class="stage" id="stage"></div><button class="px" id="pClose" aria-label="Exit presentation">×</button><div class="pc" id="pCount"></div></div>

      if (has('DEPARTMENT') && has('CODE') && has('QUANTITY') && has('AMOUNT')) return { type: 'salesAmt', hdr: i };
      if (r.some((c) => c.startsWith('ITEM, CODE')) && has('UOM') && r.some((c) => c.includes('TOTAL BY ALL WAREHOUSES'))) return { type: 'stockSnapshot', hdr: i };
      if (has('ITEM') && has('CODE') && has('UOM') && r.some((c) => c.includes('TOTAL BY ALL WAREHOUSES'))) return { type: 'stockSnapshot', hdr: i };
      if (has('CODE') && has('UOM') && has('CATEGORY') && has('BRAND') && has('INACTIVE')) return { type: 'itemMaster', hdr: i };
      if (has('ITEM') && has('CODE') && r.some((c) => c.includes('ACCOUNTING PRICE') || c.endsWith('PRICE (AED)'))) return { type: 'prices', hdr: i };
      if (has('WAREHOUSE') && (has('ITEM.CODE') || has('CODE')) && (aoa[i] || []).filter((c) => toMonth(c)).length >= 3) {
        const below = [i + 1, i + 2, i + 3].map((k) => rowNorm(aoa[k]).join(' ')).join(' ');
        if (below.includes('INWARD')) return { type: 'mixMonthly', hdr: i };
        if (below.includes('CLOSING BALANCE') || below.includes('OPENING BALANCE')) return { type: 'stockMonthly', hdr: i };
      }
      if (has('WAREHOUSE') && has('ITEM.CODE') && has('INWARD')) return { type: 'itrMix', hdr: i };
      if (has('WAREHOUSE') && has('ITEM.CODE') && has('CLOSING BALANCE')) return { type: 'itrStock', hdr: i };
    }
    for (let i = 0; i < aoa.length; i++) {
      const r = rowNorm(aoa[i]);
      if (r.includes('TOTAL DELIVERED') || r.includes('TOTAL JOBS RECEIVED') || r.includes('ONTIME PICKING')) return { type: 'employee' };
    }
    return null;
  };

  CT.DATASET_LABELS = {
    tro: 'Stock transfer requests (fulfilment)', fill: 'Stock transfer item-wise (fill rate)', gi: 'Goods issue list (document posting)',
    scanShip: 'Inventory transfer scan result — shipped', scanRecv: 'Inventory transfer scan result — received',
    cfgsHelper: 'CFGS helper report', employee: 'Employee dashboard summary (roles)',
    salesAmt: '12-month sales by department (ABC)', stockSnapshot: 'Stock valuation snapshot (extra warehouse stock)', mixMonthly: '12-month mixing usage (ITR)', stockMonthly: 'Monthly stock by warehouse (ITR)', itemMaster: 'Item master', prices: 'Unit prices',
    itrSales: 'Last 12 months sales (ITR)', itrMix: 'Mixing shop inward (ITR)', itrStock: 'Monthly closing balance (ITR)'
  };

  /* ---------- parsers ---------- */
  CT.parseScan = (aoa) => {
    let h = -1;
    for (let i = 0; i < Math.min(aoa.length, 20); i++) { const r = rowNorm(aoa[i]); if (r.includes('NOT DONE') && r.includes('GRAND TOTAL')) { h = i; break; } }
    if (h < 0) throw new Error('Scan result header (Not done / Grand Total) not found');
    const hdr = rowNorm(aoa[h]);
    const ci = { nd: colOf(hdr, 'Not done'), pc: colOf(hdr, 'Partially Completed'), c: colOf(hdr, 'Completed'), gt: colOf(hdr, 'Grand Total') };
    const rows = []; let total = null;
    for (let i = h + 1; i < aoa.length; i++) {
      const r = aoa[i] || []; const gt = num(r[ci.gt]);
      if (gt == null) continue;
      const label = r[0] == null ? '' : String(r[0]).trim();
      const row = { wh: label, nd: n0(r[ci.nd]), pc: n0(r[ci.pc]), c: n0(r[ci.c]), gt };
      if (/^(GRAND )?TOTAL$/.test(norm(label))) { total = row; break; }
      rows.push(row);
    }
    // hierarchical (parent rows followed by children that sum to the parent) vs flat
    const parents = []; let i = 0; let ok = true;
    while (i < rows.length) {
      const p = rows[i]; parents.push(p); let acc = 0; let j = i + 1;
      while (j < rows.length && acc < p.gt - 1e-9) { acc += rows[j].gt; j++; }
      if (Math.abs(acc - p.gt) > 1e-6) { ok = false; break; }
      i = j;
    }
    let list = parents;
    const sum = (l) => l.reduce((a, r) => a + r.gt, 0);
    if (!ok || (total && Math.abs(sum(parents) - total.gt) > 1e-6)) {
      if (total && Math.abs(sum(rows) - total.gt) < 1e-6) list = rows; else if (!ok) list = rows;
    }
    list = list.filter((r) => r.wh);
    if (!total) total = { wh: 'Total', nd: list.reduce((a, r) => a + r.nd, 0), pc: list.reduce((a, r) => a + r.pc, 0), c: list.reduce((a, r) => a + r.c, 0), gt: sum(list) };
    return { rows: list.map((r) => ({ wh: r.wh.replace(/\s+/g, ' ').trim(), nd: r.nd, pc: r.pc, c: r.c, gt: r.gt })), total: { nd: total.nd, pc: total.pc, c: total.c, gt: total.gt } };
  };

  CT.parseTro = (aoa, hdrIdx) => {
    const hdr = rowNorm(aoa[hdrIdx]);
    const ci = { date: colOf(hdr, 'Date'), num: colOf(hdr, 'Number'), status: colOf(hdr, 'Status'), src: colOf(hdr, 'Source Warehouse'), dst: colOf(hdr, 'Destination Warehouse') };
    const by = {}; const dates = []; let total = 0; const statusCount = {};
    for (let i = hdrIdx + 1; i < aoa.length; i++) {
      const r = aoa[i] || [];
      const number = r[ci.num]; const status = r[ci.status]; const src = r[ci.src];
      if (!number || !status || !src) continue;
      if (ci.date >= 0) dates.push(r[ci.date]);
      const st = String(status).trim(); const wh = String(src).replace(/\s+/g, ' ').trim();
      by[wh] = by[wh] || { wh, total: 0, status: {} };
      by[wh].total++; by[wh].status[st] = (by[wh].status[st] || 0) + 1;
      statusCount[st] = (statusCount[st] || 0) + 1; total++;
    }
    const byWh = Object.values(by).map((w) => ({ wh: w.wh, total: w.total, shipped: w.status['Shipped'] || 0, partial: w.status['Partially Shipped'] || 0, waitApproval: w.status['Waiting for Approval'] || 0, waitProcessing: w.status['Waiting for Processing'] || 0, status: w.status }))
      .sort((a, b) => a.wh.localeCompare(b.wh));
    return { month: modalMonth(dates), data: { byWh, total, statusCount, shipped: statusCount['Shipped'] || 0, approved: total - (statusCount['Waiting for Approval'] || 0) } };
  };

  CT.parseFill = (aoa, hdrIdx) => {
    const hdr = rowNorm(aoa[hdrIdx]);
    const ci = { src: colOf(hdr, 'Source Warehouse'), dst: colOf(hdr, 'Destination Warehouse'), code: colOf(hdr, 'Item Code'), cls: colOf(hdr, 'Classification'), item: colOf(hdr, 'Item'), uom: colOf(hdr, 'UOM'), req: colOf(hdr, 'Requested'), rec: colOf(hdr, 'Received'), appr: colOf(hdr, 'Approved') };
    const byClass = {}; const byDest = {}; const uoms = {}; const lines = []; let blankReq = 0;
    for (let i = hdrIdx + 1; i < aoa.length; i++) {
      const r = aoa[i] || [];
      const cls = ci.cls >= 0 ? r[ci.cls] : 'U'; if (cls == null || cls === '' || !r[ci.dst]) continue;
      const c = norm(cls); const req = num(r[ci.req]); const rec = n0(r[ci.rec]);
      if (req == null) { blankReq++; continue; }
      const dst = String(r[ci.dst]).replace(/\s+/g, ' ').trim();
      const full = rec >= req - 1e-9;
      byClass[c] = byClass[c] || { req: 0, rec: 0, lines: 0, full: 0 };
      byClass[c].req += req; byClass[c].rec += rec; byClass[c].lines++; if (full) byClass[c].full++;
      byDest[dst] = byDest[dst] || { dest: dst, req: 0, rec: 0, lines: 0, full: 0 };
      byDest[dst].req += req; byDest[dst].rec += rec; byDest[dst].lines++; if (full) byDest[dst].full++;
      const u = norm(r[ci.uom]); uoms[u] = (uoms[u] || 0) + req;
      lines.push({ dest: dst, cls: c, item: String(r[ci.item] || '').trim(), uom: String(r[ci.uom] || '').trim(), req, rec, code: codeKey(r[ci.code]), src: String(r[ci.src] || '').replace(/\s+/g, ' ').trim() });
    }
    const tot = Object.values(byClass).reduce((a, v) => ({ req: a.req + v.req, rec: a.rec + v.rec, lines: a.lines + v.lines, full: a.full + v.full }), { req: 0, rec: 0, lines: 0, full: 0 });
    lines.sort((a, b) => b.req - a.req);
    const top10 = lines.slice(0, 10).reduce((a, l) => a + l.req, 0);
    return { month: null, data: { hasClass: ci.cls >= 0, byClass, total: tot, byDest: Object.values(byDest).sort((a, b) => b.req - a.req), uomCount: Object.keys(uoms).length, top10Share: div(top10, tot.req), topLines: lines.slice(0, 8).map((l) => ({ dest: l.dest, cls: l.cls, item: l.item, uom: l.uom, req: l.req, rec: l.rec })), blankReq, lines: lines.map((l) => [l.code, l.src, l.cls, l.req, l.rec]) } };
  };

  CT.parseGi = (aoa, hdrIdx, settings) => {
    const hdr = rowNorm(aoa[hdrIdx]);
    const ci = { date: colOf(hdr, 'Date'), num: colOf(hdr, 'Number'), mode: colOf(hdr, 'Mode'), st: colOf(hdr, 'Receipt Status'), snd: colOf(hdr, 'Sender'), rcp: colOf(hdr, 'Recipient'), fin: colOf(hdr, 'Final Destination Warehouse') };
    const pat = norm(settings.grRecipientPattern || 'STOCK IN TRANSFER');
    const dates = []; let total = 0; let pendingAll = 0; const pending = []; let pendingToShop = 0; let selfExcluded = 0;
    for (let i = hdrIdx + 1; i < aoa.length; i++) {
      const r = aoa[i] || []; if (!r[ci.num]) continue;
      total++; if (ci.date >= 0) dates.push(r[ci.date]);
      const st = norm(r[ci.st]);
      if (!st.includes('PENDING')) continue;
      pendingAll++;
      const rcp = norm(r[ci.rcp]);
      if (!rcp.includes(pat)) { pendingToShop++; continue; }
      const snd = String(r[ci.snd] || '').replace(/\s+/g, ' ').trim();
      const fin = String((ci.fin >= 0 ? r[ci.fin] : '') || r[ci.rcp] || '').replace(/\s+/g, ' ').trim();
      const self = norm(snd) === norm(fin);
      if (self) selfExcluded++;
      pending.push({ number: String(r[ci.num]), date: r[ci.date] instanceof Date ? r[ci.date].toISOString().slice(0, 10) : String(r[ci.date] || ''), sender: snd, dest: fin, self });
    }
    return { month: modalMonth(dates), data: { total, pendingAll, pendingToShop, pending: pending.slice(0, 200), selfCount: selfExcluded } };
  };

  CT.parseCfgsHelper = (aoa, hdrIdx) => {
    const hdr = rowNorm(aoa[hdrIdx]);
    const ci = { name: colOf(hdr, 'Helper Name'), dept: colOf(hdr, 'Department'), giC: colOf(hdr, 'Goods Issue Count'), giI: colOf(hdr, 'Total Items Issued'), giS: colOf(hdr, 'Issue Scanned Items'), giT: colOf(hdr, 'Issue Time (mins)'), grC: colOf(hdr, 'Goods Received Count'), grI: colOf(hdr, 'Total Items Received'), grS: colOf(hdr, 'Receive Scanned Items'), grT: colOf(hdr, 'Receive Time (mins)') };
    const rows = [];
    for (let i = hdrIdx + 1; i < aoa.length; i++) {
      const r = aoa[i] || []; const name = r[ci.name];
      if (!name || num(r[ci.giC]) == null) continue;
      rows.push({ name: String(name).trim(), dept: String(r[ci.dept] || '').trim(), giCount: n0(r[ci.giC]), giItems: n0(r[ci.giI]), giScanned: n0(r[ci.giS]), giTime: n0(r[ci.giT]), grCount: n0(r[ci.grC]), grItems: n0(r[ci.grI]), grScanned: n0(r[ci.grS]), grTime: n0(r[ci.grT]) });
    }
    return { month: null, data: { rows } };
  };

  /* Employee dashboard summary: sections for Foreman / Accountant (invoice prep), Mixer, Helper. Reads the first month block. */
  CT.parseEmployee = (aoa, settings) => {
    const sections = [];
    for (let i = 0; i < aoa.length; i++) {
      const r = rowNorm(aoa[i]);
      let kind = null;
      if ((r.includes('TOTAL DELIVERED') || r.includes('TOTAL INVOICE')) && (r.includes('ONTIME PREPARED') || r.includes('ON-TIME PREPARED'))) kind = 'invoice';
      else if (r.includes('TOTAL JOBS RECEIVED')) kind = 'mixer';
      else if (r.includes('ONTIME PICKING') || r.includes('ON-TIME PICKINGS')) kind = 'helper';
      if (kind) sections.push({ i, kind, hdr: r });
    }
    const out = { foreman: [], accountant: [], mixer: [], helper: [] }; let month = null; let invoiceSeen = 0;
    sections.forEach((s, si) => {
      let role = s.kind;
      if (s.kind === 'invoice') {
        const around = [s.i - 1, s.i - 2, s.i - 3].filter((k) => k >= 0).map((k) => rowNorm(aoa[k]).join(' ')).join(' ');
        role = around.includes('ACCOUNTANT') ? 'accountant' : around.includes('FOREMAN') ? 'foreman' : (invoiceSeen === 0 ? 'foreman' : 'accountant');
        invoiceSeen++;
      }
      if (out[role] && out[role].length) return; // only the first section per role
      const hdr = s.hdr;
      const firstKey = { invoice: ['TOTAL DELIVERED', 'TOTAL INVOICE'], mixer: ['TOTAL JOBS RECEIVED'], helper: ['ONTIME PICKING', 'ON-TIME PICKINGS'] }[s.kind];
      const start = Math.min(...firstKey.map((k) => hdr.indexOf(k)).filter((x) => x >= 0));
      let end = hdr.length;
      for (let c = start + 1; c < hdr.length; c++) if (firstKey.includes(hdr[c])) { end = c; break; }
      const blk = hdr.slice(0, end);
      const f = (...c) => { const k = colOf(blk.slice(start), ...c); return k < 0 ? -1 : k + start; };
      const nameCol = Math.max(colOf(blk, 'Employee'), colOf(blk, 'Helper'));
      const nc = nameCol >= 0 ? nameCol : 1;
      const bc = colOf(blk.slice(0, start), 'Branch', 'Warehouse');
      // block month from the date row just above the header
      for (let k = s.i - 1; k >= Math.max(0, s.i - 3) && !month; k--) {
        const rr = aoa[k] || [];
        for (let c = start; c < end; c++) { const m = toMonth(rr[c]); if (m && (rr[c] instanceof Date || typeof rr[c] === 'number')) { month = m; break; } }
      }
      const stop = si + 1 < sections.length ? sections[si + 1].i : aoa.length;
      for (let k = s.i + 1; k < stop; k++) {
        const r = aoa[k] || []; const name = r[nc];
        if (/^MAX /.test(norm(r[0])) || /^MAX /.test(norm(name))) break;
        if (!name || typeof name !== 'string' || !name.trim()) continue;
        if (['MIXERS', 'MIXER', 'HELPERS', 'HELPER', 'EMPLOYEE', 'ACCOUNTANT', 'FOREMAN', 'WAREHOUSE', 'BRANCH'].includes(norm(name))) continue;
        const bk = bc >= 0 && r[bc] ? CT.branchKey(settings, r[bc]) : { key: null, leave: false };
        const base = { name: name.replace(/\s+/g, ' ').trim(), nameKey: norm(name), branch: bk.key, onLeave: bk.leave };
        if (s.kind === 'invoice') {
          const cols = { del: f('Total Delivered', 'Total Invoice'), on: f('Ontime Prepared', 'On-time Prepared'), pct: f('Ontime %'), sa: f('SOP Violation (Accepted)', 'SOP Violation (Rejected)'), sc: f('SOP Violation (Created)') };
          out[role].push(Object.assign(base, { delivered: n0(r[cols.del]), ontime: n0(r[cols.on]), pctReported: cols.pct >= 0 ? num(r[cols.pct]) : null, sopA: cols.sa >= 0 ? n0(r[cols.sa]) : 0, sopC: cols.sc >= 0 ? n0(r[cols.sc]) : 0 }));
        } else if (s.kind === 'mixer') {
          const cols = { jobs: f('Total Jobs Received'), mixed: f('Total Mixed'), pend: f('Mixing Pending'), remake: f('Remake Completed'), on: f('Ontime Mixing') };
          out.mixer.push(Object.assign(base, { jobs: n0(r[cols.jobs]), mixed: n0(r[cols.mixed]), pending: n0(r[cols.pend]), remake: n0(r[cols.remake]), ontime: n0(r[cols.on]) }));
        } else {
          const cols = { on: f('Ontime Picking', 'On-time Pickings'), picks: f('Total Pickings'), pct: f('Ontime Picking %'), iss: f('Total Products Issued', 'Total Products Picked'), scn: f('Total Products Scanned', 'Total Scanned Products') };
          out.helper.push(Object.assign(base, { ontime: n0(r[cols.on]), picks: n0(r[cols.picks]), pctReported: cols.pct >= 0 ? num(r[cols.pct]) : null, issued: n0(r[cols.iss]), scanned: n0(r[cols.scn]) }));
        }
      }
    });
    out.hasBranch = ['foreman', 'accountant', 'mixer', 'helper'].some((r) => out[r].some((e) => e.branch));
    return { month, data: out };
  };

  /* Employee master: name -> {name, branch, roles}. Raw ERP export has no branch column. */
  CT.masterFromEmployee = (emp, master) => {
    const M = JSON.parse(JSON.stringify(master || {}));
    ['foreman', 'accountant', 'mixer', 'helper'].forEach((r) => (emp[r] || []).forEach((e) => {
      const m = M[e.nameKey] || (M[e.nameKey] = { name: e.name, branch: '', roles: [] });
      if (e.branch) m.branch = e.branch;
      if (!m.roles.includes(r)) m.roles.push(r);
    }));
    return M;
  };
  CT.leaveFromEmployee = (emp) => { const L = {}; ['foreman', 'accountant', 'mixer', 'helper'].forEach((r) => (emp[r] || []).forEach((e) => { if (e.onLeave) L[e.nameKey] = true; })); return L; };
  CT.hasLeft = (m, month) => !!(m && m.status === 'left' && m.leftAfter && month && month > m.leftAfter);
  CT.resolveRoles = (emp, master, leave, S, month) => {
    const roles = JSON.parse(JSON.stringify(emp)); const M = master || {}; const L = leave || {};
    const leftActive = [];
    ['foreman', 'accountant', 'mixer', 'helper'].forEach((r) => {
      roles[r] = roles[r].filter((e) => { if (!CT.hasLeft(M[e.nameKey], month)) return true; if ((e.delivered || e.mixed || e.picks || 0) > 0) leftActive.push(e.name); return false; });
    });
    ['foreman', 'accountant'].forEach((r) => {
      const other = r === 'foreman' ? 'accountant' : 'foreman';
      Object.entries(M).forEach(([k, m]) => {
        if ((m.roles || []).includes(r) && !CT.hasLeft(m, month) && !roles[r].some((e) => e.nameKey === k)) { const src = roles[other].find((e) => e.nameKey === k); if (src) roles[r].push({ ...src, dualRole: true }); }
      });
    });
    const unassigned = new Set();
    ['foreman', 'accountant', 'mixer', 'helper'].forEach((r) => roles[r].forEach((e) => {
      const m = M[e.nameKey];
      if (m && m.branch) e.branch = CT.branchKey(S, m.branch).key;
      if (!e.branch) { e.branch = 'UNASSIGNED'; if ((e.delivered || e.mixed || e.picks || 0) > 0) unassigned.add(e.nameKey); }
      if (L[e.nameKey] != null) e.onLeave = !!L[e.nameKey];
    }));
    const DK = S.departmentKpiOnly || [];
    if (DK.length) ['foreman', 'accountant', 'mixer', 'helper'].forEach((r) => { roles[r] = roles[r].filter((e) => !DK.includes(e.branch)); });
    return { roles, unassigned: [...unassigned], leftActive: [...new Set(leftActive)] };
  };

  /* ITR inputs */
  CT.parseItrSales = (aoa, hdrIdx) => {
    const hdr = rowNorm(aoa[hdrIdx]); const ci = { dep: colOf(hdr, 'Department'), code: colOf(hdr, 'Code'), qty: colOf(hdr, 'Sales Qty'), amt: colOf(hdr, 'Amount'), item: colOf(hdr, 'Item'), uom: colOf(hdr, 'UOM') };
    const rows = [];
    for (let i = hdrIdx + 1; i < aoa.length; i++) { const r = aoa[i] || []; if (!r[ci.dep] || r[ci.code] == null) continue; rows.push([norm(r[ci.dep]), String(r[ci.code]).trim(), n0(r[ci.qty]), n0(r[ci.amt]), norm(r[ci.uom])]); }
    return { month: null, data: { rows } };
  };
  const monthCols = (aoa, hdrIdx, label) => {
    const hdr = rowNorm(aoa[hdrIdx]); const cols = [];
    hdr.forEach((h, c) => { if (h === label) { let m = null; for (let k = hdrIdx - 1; k >= 0 && !m; k--) m = toMonth((aoa[k] || [])[c]); if (m) cols.push({ c, m }); } });
    return cols;
  };
  CT.parseItrMix = (aoa, hdrIdx) => {
    const hdr = rowNorm(aoa[hdrIdx]); const ci = { wh: colOf(hdr, 'Warehouse'), code: colOf(hdr, 'Item.Code'), brand: colOf(hdr, 'Item.Brand') };
    const mc = monthCols(aoa, hdrIdx, 'INWARD'); const rows = [];
    for (let i = hdrIdx + 1; i < aoa.length; i++) { const r = aoa[i] || []; if (!r[ci.wh] || r[ci.code] == null) continue; rows.push([norm(r[ci.wh]), String(r[ci.code]).trim(), String(r[ci.brand] || '').trim(), mc.reduce((a, x) => a + n0(r[x.c]), 0)]); }
    return { month: mc.length ? mc[mc.length - 1].m : null, data: { rows, months: mc.map((x) => x.m) } };
  };
  CT.parseItrStock = (aoa, hdrIdx) => {
    const hdr = rowNorm(aoa[hdrIdx]); const ci = { wh: colOf(hdr, 'Warehouse'), code: colOf(hdr, 'Item.Code'), brand: colOf(hdr, 'Item.Brand'), uom: colOf(hdr, 'Item.Unit of Measure') };
    const mc = monthCols(aoa, hdrIdx, 'CLOSING BALANCE'); const rows = [];
    for (let i = hdrIdx + 1; i < aoa.length; i++) {
      const r = aoa[i] || []; if (!r[ci.wh] || r[ci.code] == null) continue;
      const vals = mc.map((x) => num(r[x.c])).filter((v) => v != null);
      const avgNonBlank = vals.length ? vals.reduce((a, v) => a + v, 0) / vals.length : 0;
      const avgAll = mc.length ? mc.reduce((a, x) => a + n0(r[x.c]), 0) / mc.length : 0;
      rows.push([norm(r[ci.wh]), String(r[ci.code]).trim(), String(r[ci.brand] || '').trim(), avgNonBlank, avgAll, norm(r[ci.uom])]);
    }
    return { month: mc.length ? mc[mc.length - 1].m : null, data: { rows, months: mc.map((x) => x.m) } };
  };

  /* ---------- ABC / ITR inputs (12-month sales, mixing, stock, item master, prices) ---------- */
  const codeKey = (c) => String(c == null ? '' : c).trim().toUpperCase();
  const LONGM = LONG_MONTHS.map((m) => m.toUpperCase());
  const textMonth = (t) => { const m = norm(t).match(/([A-Z]+)\s+(\d{1,2}),\s*(\d{4})/); if (!m) return null; const i = LONGM.findIndex((x) => x.startsWith(m[1].slice(0, 3))); return i < 0 ? null : m[3] + '-' + String(i + 1).padStart(2, '0'); };
  CT.parseSalesAmt = (aoa, hdrIdx) => {
    const hdr = rowNorm(aoa[hdrIdx]); const ci = { dep: colOf(hdr, 'Department'), item: colOf(hdr, 'Item'), code: colOf(hdr, 'Code'), uom: colOf(hdr, 'UOM'), qty: colOf(hdr, 'Quantity'), amt: colOf(hdr, 'Amount') };
    let from = null; let to = null;

        found.push({ type: d.type, file: fileName, sheet: name, error: e.message });
      }
    });
    return { found, skipped };
  };
  const countRows = (t, d) => {
    switch (t) {
      case 'tro': return d.total; case 'fill': return d.total.lines; case 'gi': return d.total;
      case 'scanShip': case 'scanRecv': return d.rows.length; case 'cfgsHelper': return d.rows.length;
      case 'employee': return d.foreman.length + d.accountant.length + d.mixer.length + d.helper.length;
      case 'itemMaster': return Object.keys(d.items).length; case 'prices': return Object.keys(d.prices).length;
      default: return d.rows ? d.rows.length : 0;
    }
  };
  /* Resolve month tokens ("Jun" in a sheet name) against the year of the dated datasets */
  CT.resolveMonths = (datasets, reviewMonth) => {
    const dated = datasets.filter((d) => typeof d.month === 'string').map((d) => d.month).sort();
    const now = new Date(); const anchor = reviewMonth || dated[dated.length - 1] || (now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0'));
    const ay = +anchor.slice(0, 4); const am = +anchor.slice(5, 7);
    datasets.forEach((d) => {
      if (d.month && typeof d.month === 'object') { const t = d.month.token; const y = t > am + 2 ? ay - 1 : t < am - 9 ? ay + 1 : ay; d.month = y + '-' + String(t).padStart(2, '0'); }
      if (!d.month) { d.month = reviewMonth; d.monthSource = 'review month'; }
    });
    return datasets;
  };
  CT.suggestReviewMonth = (datasets) => {
    const c = {};
    datasets.forEach((d) => { if (typeof d.month === 'string' && ['tro', 'gi', 'employee'].includes(d.type)) c[d.month] = (c[d.month] || 0) + 1; });
    const ms = Object.keys(c).sort();
    if (!ms.length) { const any = datasets.filter((d) => typeof d.month === 'string').map((d) => d.month).sort(); return any.length ? any[any.length - 1] : null; }
    return ms.sort((a, b) => c[b] - c[a] || b.localeCompare(a))[0];
  };

  /* ITR data sets merge into one ITR object */
  CT.buildItr = (sales, mix, stock, settings) => {
    if (!sales || !stock) return null;
    const keyOf = (wh, code) => CT.branchKey(settings, wh).key + '|' + code;
    const agg = {}; const brandByKey = {}; const brandByCode = {};
    (stock.rows || []).forEach(([wh, code, brand, avgNB, avgAll]) => { const k = keyOf(wh, code); agg[k] = agg[k] || { s: 0, m: 0, avg: 0, avgAll: 0 }; agg[k].avg += avgNB; agg[k].avgAll += avgAll; if (brand) { brandByKey[k] = brand; brandByCode[code] = brandByCode[code] || brand; } });
    (mix ? mix.rows : []).forEach(([wh, code, brand, q]) => { const k = keyOf(wh, code); agg[k] = agg[k] || { s: 0, m: 0, avg: 0, avgAll: 0 }; agg[k].m += q; agg[k].moved = true; if (brand) { brandByKey[k] = brandByKey[k] || brand; brandByCode[code] = brandByCode[code] || brand; } });
    sales.rows.forEach(([wh, code, q]) => { const k = keyOf(wh, code); agg[k] = agg[k] || { s: 0, m: 0, avg: 0, avgAll: 0 }; agg[k].s += q; agg[k].moved = true; });
    const byBranch = {}; const byBB = {}; let unbranded = 0;
    Object.entries(agg).forEach(([k, v]) => {
      const [br, code] = k.split('|'); const brand = brandByKey[k] || brandByCode[code] || 'Unmapped';
      if (brand === 'Unmapped' && v.moved) unbranded++;
      byBranch[br] = byBranch[br] || { qty: 0, avg: 0, avgAllStock: 0, deadAvg: 0, items: 0, deadItems: 0 };
      const b = byBranch[br];
      b.avgAllStock += v.avg;
      if (v.moved) { b.qty += v.s + v.m; b.avg += v.avg; b.items++; } else if (v.avg > 0) { b.deadAvg += v.avg; b.deadItems++; }
      if (v.moved) { const kk = br + '|' + brand; byBB[kk] = byBB[kk] || { branch: br, brand, qty: 0, avg: 0 }; byBB[kk].qty += v.s + v.m; byBB[kk].avg += v.avg; }
    });
    const branches = Object.entries(byBranch).map(([br, v]) => ({ branch: br, qty: v.qty, avg: v.avg, itr: div(v.qty, v.avg), itrAllStock: div(v.qty, v.avgAllStock), deadShare: div(v.deadAvg, v.avgAllStock), deadItems: v.deadItems }));
    const brandTot = {};
    Object.values(byBB).forEach((x) => { brandTot[x.brand] = brandTot[x.brand] || { qty: 0, avg: 0 }; brandTot[x.brand].qty += x.qty; brandTot[x.brand].avg += x.avg; });
    const brands = Object.entries(brandTot).map(([brand, v]) => ({ brand, qty: v.qty, avg: v.avg, itr: div(v.qty, v.avg) })).sort((a, b) => b.avg - a.avg);
    const cells = {}; Object.values(byBB).forEach((x) => { cells[x.brand + '|' + x.branch] = { qty: x.qty, avg: x.avg, itr: div(x.qty, x.avg) }; });
    const tq = branches.reduce((a, b) => a + b.qty, 0); const ta = branches.reduce((a, b) => a + b.avg, 0); const taAll = Object.values(byBranch).reduce((a, b) => a + b.avgAllStock, 0);
    return { months: stock.months, branches, brands: brands.slice(0, 14), brandCount: brands.length, cells, total: { qty: tq, avg: ta, itr: div(tq, ta), itrAllStock: div(tq, taAll), deadShare: div(taAll - ta, taAll) }, unbranded };
  };

  /* ---------- scoring ---------- */
  const band = (v, S, pts) => { if (v == null) return null; for (let i = 0; i < S.stockBands.length; i++) if (v >= S.stockBands[i] - 1e-9) return pts[i]; return pts[pts.length - 1]; };
  CT.band = band;

  const scanAdh = (row, S) => (row && row.gt ? (row.c + (S.scanIncludesPartial ? row.pc : 0)) / row.gt : null);
  CT.scanAdh = scanAdh;

  const roleIndividual = (role, list, S) => {
    const min = S.minRoleVolume;
    const cap = (v) => (S.capRatiosAt100 ? cap1(v) : v);
    if (role === 'foreman' || role === 'accountant') {
      const netMax = Math.max(0, ...list.map((e) => e.delivered));
      const brMax = {}; const brTot = {};
      list.forEach((e) => { brMax[e.branch] = Math.max(brMax[e.branch] || 0, e.delivered); if (!e.onLeave) brTot[e.branch] = (brTot[e.branch] || 0) + e.delivered; });
      const maxTot = Math.max(0, ...Object.values(brTot));
      const maxFor = (e) => (role !== 'accountant' || S.accountantNorm === 'network' ? netMax : S.accountantNorm === 'branchTotal' ? maxTot : brMax[e.branch]);
      list.forEach((e) => { const max = maxFor(e); e.pct = cap(e.pctReported != null && e.delivered ? e.pctReported : div(e.ontime, e.delivered)); e.score = e.delivered > min ? 5 * e.delivered / max + 95 * (e.pct || 0) : 0; e.active = e.delivered > min; e.volMax = max; });
    } else if (role === 'mixer') {
      const max = Math.max(0, ...list.map((e) => e.mixed));
      list.forEach((e) => { e.sla = cap(div(e.ontime, e.mixed)); e.score = e.mixed > min ? 5 * e.mixed / max + 95 * (e.sla || 0) : 0; e.active = e.mixed > min; });
    } else {
      const max = Math.max(0, ...list.map((e) => e.picks));
      list.forEach((e) => { e.pickPct = cap(e.pctReported != null && e.picks ? e.pctReported : div(e.ontime, e.picks)); e.scanPct = cap(div(e.scanned, e.issued)); e.score = e.picks > 0 ? 5 * e.picks / max + 15 * (e.scanPct || 0) + 80 * (e.pickPct || 0) : 0; e.active = e.picks > min; });
    }
    return list;
  };

  const roleBranch = (roles, S) => {
    const agg = {};
    const add = (br, role, f) => { agg[br] = agg[br] || {}; agg[br][role] = agg[br][role] || { n: 0 }; f(agg[br][role]); agg[br][role].n++; };
    const RO = S.rosterOnlyBranches || [];
    roles.accountant.filter((e) => !e.onLeave && e.delivered > 0 && e.branch !== 'UNASSIGNED' && !RO.includes(e.branch)).forEach((e) => add(e.branch, 'acct', (a) => { a.vol = (a.vol || 0) + e.delivered; a.on = (a.on || 0) + e.ontime; }));
    roles.mixer.filter((e) => !e.onLeave && e.mixed > 0 && e.branch !== 'UNASSIGNED' && !RO.includes(e.branch)).forEach((e) => add(e.branch, 'mixer', (a) => { a.vol = (a.vol || 0) + e.mixed; a.on = (a.on || 0) + e.ontime; }));
    roles.helper.filter((e) => !e.onLeave && e.picks > 0 && e.branch !== 'UNASSIGNED' && !RO.includes(e.branch)).forEach((e) => add(e.branch, 'helper', (a) => { a.vol = (a.vol || 0) + e.picks; a.on = (a.on || 0) + e.ontime; a.iss = (a.iss || 0) + e.issued; a.scn = (a.scn || 0) + e.scanned; }));
    const maxOf = (r) => Math.max(0, ...Object.values(agg).map((b) => (b[r] ? b[r].vol : 0)));
    const mx = { acct: maxOf('acct'), mixer: maxOf('mixer'), helper: maxOf('helper') };
    const cap = (v) => (S.capRatiosAt100 ? cap1(v) : v);
    const out = {};
    Object.entries(agg).forEach(([br, b]) => {
      out[br] = {};
      if (b.acct) out[br].acct = 0.05 * b.acct.vol / mx.acct + 0.95 * cap(b.acct.on / b.acct.vol);
      if (b.mixer) out[br].mixer = 0.05 * b.mixer.vol / mx.mixer + 0.95 * cap(b.mixer.on / b.mixer.vol);
      if (b.helper) out[br].helper = 0.05 * b.helper.vol / mx.helper + 0.15 * (cap(div(b.helper.scn, b.helper.iss)) || 0) + 0.80 * cap(b.helper.on / b.helper.vol);
    });
    return out;
  };

  /* Main compute: monthDoc = {month, data:{...}, manual:{...}} → view model */
  CT.compute = (doc, S, master, ctx) => {
    const data = doc.data || {}; const man = doc.manual || {}; const dq = [];
    const out = { month: doc.month, has: {}, dq };
    const nameOf = (k) => CT.branchName(S, k);

    /* scan */
    const scan = {};
    ['scanShip', 'scanRecv'].forEach((t) => {
      const d = data[t]; if (!d) return;
      out.has[t] = true;
      const rows = d.rows.map((r) => ({ ...r, key: CT.branchKey(S, r.wh).key, adh: scanAdh(r, S), adhC: div(r.c, r.gt) }));
      scan[t] = { rows, total: { ...d.total, adh: scanAdh(d.total, S), adhC: div(d.total.c, d.total.gt) } };
      const partialHeavy = rows.filter((r) => r.gt >= 20 && r.pc > r.c);
      partialHeavy.forEach((r) => dq.push({ level: 'high', area: t === 'scanShip' ? 'Goods issue scan' : 'Goods receipt scan', text: `${r.wh}: ${r.pc} of ${r.gt} transfers only partially scanned vs ${r.c} fully completed. Adherence shows ${pct(r.adh)} because partial scans count as adherent; completed-only adherence is ${pct(r.adhC)}.` }));
    });
    out.scan = scan;
    const scanFor = (t, key) => { const s = scan[t]; if (!s) return null; const r = s.rows.find((x) => x.key === key); return r ? r.adh : null; };
    if (scan.scanShip && scan.scanRecv && S.scanIncludesPartial) {
      const gap = scan.scanShip.total.adh - scan.scanShip.total.adhC; const gap2 = scan.scanRecv.total.adh - scan.scanRecv.total.adhC;
      if (gap > 0.03 || gap2 > 0.03) dq.push({ level: 'med', area: 'Scan adherence', text: `Partial scans are counted as adherent. Completed-only adherence is ${pct(scan.scanShip.total.adhC)} for goods issue (vs ${pct(scan.scanShip.total.adh)}) and ${pct(scan.scanRecv.total.adhC)} for goods receipt (vs ${pct(scan.scanRecv.total.adh)}).` });
    }

    /* goods issue / GR pending */
    let grPendingBy = null;
    if (data.gi) {
      out.has.gi = true; const g = data.gi;
      const counted = g.pending.filter((p) => !(S.grExcludeSelfTransfers && p.self));
      grPendingBy = {};
      counted.forEach((p) => { const k = CT.branchKey(S, p.dest).key; grPendingBy[k] = (grPendingBy[k] || 0) + 1; });
      const destNames = [...new Set(counted.map((p) => p.dest))];
      out.docs = { giTotal: g.total, giPending: counted.length, giReceived: g.total - counted.length, pendingList: g.pending, pendingToShop: g.pendingToShop, comment: destNames.join(', ') || '—', selfExcluded: S.grExcludeSelfTransfers ? g.pending.filter((p) => p.self).length : 0 };
      if (g.pendingToShop) dq.push({ level: 'info', area: 'Document posting', text: `${g.pendingToShop} goods issues from branch warehouses to their own shop show "Receipt Pending" and are excluded from the GR pending count (only recipient "${CT.titleCase(S.grRecipientPattern)}" is counted).` });
      if (out.docs.selfExcluded) dq.push({ level: 'med', area: 'Document posting', text: `${out.docs.selfExcluded} pending goods issue(s) where sender and final destination are the same warehouse were excluded from GR pending: ${g.pending.filter((p) => p.self).map((p) => p.number + ' (' + p.dest + ')').join(', ')}. Confirm this rule.` });
    }
    if (data.tro) { out.docs = out.docs || {}; out.docs.strRaised = data.tro.approved; out.docs.strTotal = data.tro.total; }
    if (out.docs) out.docs.stoRaised = man.stoRaised == null || man.stoRaised === '' ? null : Number(man.stoRaised);

    /* fulfilment */
    if (data.tro) {
      out.has.tro = true;
      const exW = (S.fulfilExcludedWarehouses || []).map(norm).filter(Boolean);
      const excluded = data.tro.byWh.filter((w) => exW.some((k) => norm(w.wh).includes(k)));
      const keep = data.tro.byWh.filter((w) => !excluded.includes(w));
      const rows = keep.map((w) => ({ ...w, key: norm(w.wh), rate: div(w.shipped, w.total) }))
        .sort(S.fulfilSort === 'rate' ? (a, b) => (b.rate - a.rate) || a.wh.localeCompare(b.wh) : (a, b) => (b.total - a.total) || a.wh.localeCompare(b.wh));
      const tot = keep.reduce((a, w) => a + w.total, 0); const sh = keep.reduce((a, w) => a + w.shipped, 0);
      out.fulfil = { rows, overall: div(sh, tot), total: tot, shipped: sh, excluded: excluded.map((w) => ({ wh: w.wh, total: w.total })) };
      if (excluded.length) dq.push({ level: 'info', area: 'Fulfilment', text: `Left out of order fulfilment: ${excluded.map((w) => w.wh + ' (' + w.total + ' requests)').join(', ')}.` });
    }

    /* fill rate */
    if (data.fill) {
      out.has.fill = true; let f = data.fill; out.fillBasis = 'export';
      const abc = ctx && ctx.abc;
      if (abc && S.fillClassSource === 'abc' && f.lines && f.lines.length) {
        const bc = {}; const tot = { req: 0, rec: 0, lines: 0, full: 0 };
        f.lines.forEach(([code, src, c0, req, rec]) => { const c = abc.companyClass[code] || 'C'; const full = rec >= req - 1e-9; const x = bc[c] || (bc[c] = { req: 0, rec: 0, lines: 0, full: 0 }); [x, tot].forEach((y) => { y.req += req; y.rec += rec; y.lines++; if (full) y.full++; }); });
        const moved = f.lines.filter(([code, , c0]) => (abc.companyClass[code] || 'C') !== norm(c0)).length;
        f = { ...f, byClass: bc, total: tot }; out.fillBasis = 'abc'; out.fillAbcMonth = ctx.abcMonth; out.fillReclassed = moved;
      }
      const byClass = {}; Object.entries(f.byClass).forEach(([c, v]) => { byClass[c] = { ...v, rate: div(v.rec, v.req), lineRate: div(v.full, v.lines) }; });
      out.fill = { hasClass: f.hasClass, byClass, total: { ...f.total, rate: div(f.total.rec, f.total.req), lineRate: div(f.total.full, f.total.lines) }, byDest: f.byDest.map((d) => ({ ...d, rate: div(d.rec, d.req), lineRate: div(d.full, d.lines) })), uomCount: f.uomCount, top10Share: f.top10Share, topLines: f.topLines };
      if (f.uomCount > 1) dq.push({ level: 'high', area: 'Fill rate', text: `Fill rate adds requested and received quantities across ${f.uomCount} units of measure (PCS, LTR, GLN, KG…). The 10 largest lines are ${pct(f.top10Share)} of all requested quantity, so a few bulk consumable lines (e.g. ${f.topLines.slice(0, 2).map((l) => CT.titleCase(l.item)).join(', ')}) drive the class result. Line fill rate (lines fully received) is ${pct(out.fill.total.lineRate)}.` });
      if (f.hasClass === false && out.fillBasis !== 'abc') dq.push({ level: 'high', area: 'Fill rate', text: 'The fill-rate export has no Classification column and no company ABC is available for this month, so lines are shown as unclassified. Upload the 12-month sales file (ABC) to classify them.' });
      if (f.blankReq) dq.push({ level: 'info', area: 'Fill rate', text: `${f.blankReq} approved lines have no requested quantity and are excluded.` });
    }

    /* roles */
    let rb = {};
    if (data.employee) {
      out.has.employee = true;
      const rr = CT.resolveRoles(data.employee, master, man.leave, S, doc.month); const roles = rr.roles;
      if (rr.leftActive.length) dq.push({ level: 'high', area: 'Employee master', text: `${rr.leftActive.map(CT.titleCase).join(', ')} ${rr.leftActive.length === 1 ? 'is' : 'are'} marked as having left the organisation before ${CT.monthLabel(doc.month)} but still ${rr.leftActive.length === 1 ? 'shows' : 'show'} activity in this month's export. They are excluded from all scores; check the exit month in Settings > Employee master or the ERP user mapping.` });
      if (rr.unassigned.length) dq.push({ level: 'high', area: 'Employee master', text: `${rr.unassigned.length} people in the employee export have no branch assigned (${rr.unassigned.slice(0, 8).map(CT.titleCase).join(', ')}${rr.unassigned.length > 8 ? '…' : ''}). They are excluded from branch scores until a branch is set in Settings > Employee master.` });
      ['foreman', 'accountant', 'mixer', 'helper'].forEach((r) => roleIndividual(r, roles[r], S));
      rb = roleBranch(roles, S);
      /* People who are both foreman and accountant: one score (the accountant score) for the foreman roster and the branch accountant component */
      const dualKeys = new Set(roles.foreman.filter((f) => roles.accountant.some((a) => a.nameKey === f.nameKey && a.active)).map((f) => f.nameKey));
      if (S.dualRoleUsesAccountantScore && dualKeys.size) {
        const acc = {}; roles.accountant.forEach((a) => { acc[a.nameKey] = a; });
        roles.foreman.forEach((f) => { if (dualKeys.has(f.nameKey)) { f.ownScore = f.score; f.score = acc[f.nameKey].score; f.fromAccountant = true; } });
        const byBr = {}; roles.accountant.filter((a) => !a.onLeave && a.delivered > 0 && a.branch !== 'UNASSIGNED').forEach((a) => { (byBr[a.branch] = byBr[a.branch] || []).push(a); });
        Object.entries(byBr).forEach(([br, list]) => {
          if (!list.some((a) => dualKeys.has(a.nameKey)) || !rb[br]) return;
          const vol = list.reduce((s, a) => s + a.delivered, 0);
          rb[br].acctBranchFormula = rb[br].acct;
          rb[br].acct = Math.min(1, list.reduce((s, a) => s + (a.score / 100) * a.delivered, 0) / vol);
          rb[br].acctFromScore = true;
        });
        dq.push({ level: 'info', area: 'Employee data', text: `${[...dualKeys].map(CT.titleCase).join(', ')} work as both foreman and accountant. Their accountant score is used as their foreman score and for their branch's accountant component; other branches use the branch-level accountant formula.` });
      }
      out.roles = roles; out.roleBranch = rb;
      // data-quality: duplicates / multi-role / leave / over-100%
      const sig = {};
      ['foreman', 'accountant'].forEach((r) => roles[r].filter((e) => e.delivered > 50 && !e.dualRole).forEach((e) => { const k = r + '|' + e.delivered + '|' + e.ontime; (sig[k] = sig[k] || []).push(e); }));
      Object.values(sig).forEach((l) => { const names = [...new Set(l.map((e) => e.nameKey))]; if (names.length > 1) dq.push({ level: 'high', area: 'Employee data', text: `Identical invoice figures for different people: ${l.map((e) => CT.titleCase(e.name) + ' (' + nameOf(e.branch) + ')').join(' and ')} (${l[0].delivered} delivered, ${l[0].ontime} on time). The ERP export itself attributes the same invoices to both people; fix the department/user mapping in the ERP report.` }); });
      const multi = {};
      ['foreman', 'accountant', 'mixer', 'helper'].forEach((r) => roles[r].filter((e) => e.active).forEach((e) => { (multi[e.nameKey] = multi[e.nameKey] || new Set()).add(r); }));
      const mm = Object.entries(multi).filter(([, s]) => s.size > 1 && !(s.size === 2 && s.has('foreman') && s.has('accountant')));
      if (mm.length) dq.push({ level: 'med', area: 'Employee data', text: `${mm.length} people are scored in more than one role on the same data: ${mm.map(([n, s]) => CT.titleCase(n) + ' (' + [...s].join(' + ') + ')').join('; ')}.` });
      const over = []; roles.helper.forEach((e) => { if (e.issued && e.scanned > e.issued) over.push(CT.titleCase(e.name) + ' scanned ' + e.scanned + ' of ' + e.issued); });
      roles.foreman.concat(roles.accountant).forEach((e) => { if (e.delivered && e.ontime > e.delivered) over.push(CT.titleCase(e.name) + ' on time ' + e.ontime + ' of ' + e.delivered); });
      if (over.length) dq.push({ level: 'info', area: 'Employee data', text: `Ratios above 100% ${S.capRatiosAt100 ? 'capped at 100%' : 'left uncapped'}: ${over.join('; ')}.` });
    }

    /* branch scorecard */
    const W = S.weights.branch; const st = man.stock || {}; const fs = man.fiveS || {};
    const vacant = [];
    const roleVal = (br, r) => {
      if (!data.employee) return { v: null };
      const v = rb[br] && rb[br][r];
      if (v != null) return { v };
      vacant.push(nameOf(br) + ' ' + ({ acct: 'accountant', mixer: 'mixer', helper: 'helper' })[r]);
      return { v: S.vacantRole === 'full' ? 1 : S.vacantRole === 'zero' ? 0 : null, vacant: true };
    };
    out.branches = S.scorecardBranches.map((k) => {
      const b = { key: k, name: nameOf(k), missing: [] };
      b.stock = num(st[k]); b.stockScore = band(b.stock, S, S.stockPts40.map((p) => p * W.stock / 40));
      b.fiveS = num(fs[k]); b.fiveSScore = b.fiveS == null ? null : cap1(b.fiveS) * W.fiveS;
      b.ship = scanFor('scanShip', k); b.shipScore = b.ship == null ? null : b.ship * W.ship;
      b.recv = scanFor('scanRecv', k); b.recvScore = b.recv == null ? null : b.recv * W.recv;
      b.grPending = grPendingBy ? (grPendingBy[k] || 0) : null; b.grScore = b.grPending == null ? null : (b.grPending > 0 ? 0 : W.gr);
      const a = roleVal(k, 'acct'); const m = roleVal(k, 'mixer'); const h = roleVal(k, 'helper');

      se.values.forEach((v, i) => { if (v != null) s += `<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="4" fill="#fff" stroke="${se.color}" stroke-width="2"/>`; });
    });
    return s + '</svg>';
  }
  const legend = (items) => `<div class="legend">${items.map((i) => `<span><i style="background:${i.color}"></i>${esc(i.name)}</span>`).join('')}</div>`;
  const statusColor = (v, hi = 0.9, lo = 0.7) => (v == null ? '#9CA3AF' : v >= hi ? C.good : v >= lo ? C.warn : C.bad);

  /* ---------------- table helper ---------------- */
  function table(cols, rows, opts = {}) {
    let h = `<table class="t ${opts.cls || ''}"><thead><tr>${cols.map((c) => `<th class="${c.l ? 'l' : ''}" ${c.w ? `style="width:${c.w}px"` : ''}>${c.h}</th>`).join('')}</tr></thead><tbody>`;
    rows.forEach((r) => { h += `<tr class="${r._cls || ''}">${cols.map((c) => { const v = c.f ? c.f(r) : r[c.k]; return `<td class="${c.l ? 'l' : ''} ${c.cls ? (typeof c.cls === 'function' ? c.cls(r) : c.cls) : ''}">${v == null ? '—' : v}</td>`; }).join('')}</tr>`; });
    return h + '</tbody></table>';
  }
  const paginate = (arr, n) => { const out = []; for (let i = 0; i < arr.length; i += n) out.push(arr.slice(i, i + n)); return out.length ? out : [[]]; };

  /* ---------------- slide builder ---------------- */
  function buildSlides(m) {
    const o = App.computed[m] || { has: {}, dq: [] };
    const S = effSettings(m); const pm = CT.addMonths(m, -1); const pm2 = CT.addMonths(m, -2);
    const SO = (x) => summaryOf(x, m);
    const P = SO(pm); const cur = SO(m);
    const ML = CT.monthLabel(m, true); const MS = CT.monthLabel(m); const PS = CT.monthLabel(pm); const PShort = CT.monthShort(pm); const MShort = CT.monthShort(m);
    const man = (App.months[m] && App.months[m].manual) || {};
    const slides = [];
    const foot = `<footer class="s-foot"><span>Shaji Paints UAE | KPI Review — ${esc(ML)}</span><span>© Assured Grow Consultancy LLC</span></footer>`;
    const add = (meta, html) => slides.push({ ...meta, html });
    const std = (id, group, nav, kicker, title, sub, body) => add({ id, group, nav: nav || title }, `<section class="slide"><img class="s-logo" src="${LOGO_ASSURED_DARK}" alt="Assured"><header class="s-head"><div class="s-kicker">${esc(kicker)}</div><h2>${esc(title)}</h2>${sub ? `<p class="s-sub">${sub}</p>` : ''}</header><div class="s-body">${body}</div>${foot}</section>`);
    const divider = (id, group, title, sub) => add({ id, group, nav: title }, `<section class="slide dark"><div class="dark-deco" style="width:420px;height:420px;right:-120px;top:-140px"></div><div class="dark-deco" style="width:300px;height:300px;right:80px;bottom:-190px;background:#241D66"></div><img class="cover-logo-r" src="${LOGO_ASSURED_LIGHT}" alt="Assured"><div class="div-title">${esc(title)}</div><div class="div-sub">${sub}</div>${foot}</section>`);
    const empty = (what, how) => `<div class="empty"><strong>No ${esc(what)} for ${esc(ML)}</strong><span>${how}</span></div>`;
    const deltaTxt = (d, prevLabel) => (d == null ? `no ${prevLabel} data` : `${d >= 0 ? '+' : ''}${d.toFixed(1)} vs ${prevLabel}`);
    const nm = (k) => CT.branchName(S, k);

    /* cover */
    add({ id: 'cover', group: 'Overview', nav: 'Cover' }, `<section class="slide dark"><div class="dark-deco" style="width:520px;height:520px;right:-160px;top:-200px"></div><div class="dark-deco" style="width:360px;height:360px;left:-140px;bottom:-200px;background:#241D66"></div><img class="cover-logo-l" src="${LOGO_SHAJI}" alt="Shaji"><img class="cover-logo-r" src="${LOGO_ASSURED_LIGHT}" alt="Assured"><div class="cover-title">Operations Control Tower</div><div class="cover-lines">Branch name: All operational warehouses<br>Review month: ${esc(MS)}<br>Prepared by: ${esc(man.preparedBy || S.preparedBy || '—')}</div>${foot}</section>`);

    /* warehouse dashboard */
    {
      const ms = [m, pm, pm2]; const sums = [cur, P, SO(pm2)];
      const scanRow = (lbl, key) => `<tr><td class="l">All UAE W/H</td><td class="l">${lbl}</td>${sums.map((s) => `<td>100%</td><td class="${cls3(s[key], 0.9, 0.8)}">${pct(s[key], 2)}</td>`).join('')}</tr>`;
      const docRow = (s, mm) => { const d = s.docs || {}; return `<tr><td class="l">${esc(CT.monthLabel(mm))}</td><td>${int(d.sto)}</td><td>${int(d.str)}</td><td>${int(d.giReceived)}</td><td class="${d.giPending ? 'r' : 'g'}">${int(d.giPending)}</td><td class="l">${esc(d.comment || '—')}</td></tr>`; };
      std('wh', 'Overview', 'Warehouse dashboard', 'WAREHOUSE DASHBOARD', 'Scan adherence and month-closing document posting', `Scan adherence counts ${S.scanIncludesPartial ? 'completed and partially completed' : 'only fully completed'} transfer scans against all transfers. GI receipt pending counts goods issues to "${esc(tc(S.grRecipientPattern))}" still pending at export${S.grExcludeSelfTransfers ? ', excluding self-transfers' : ''}.`,
        `<table class="t"><thead><tr><th class="l" rowspan="2">Warehouse</th><th class="l" rowspan="2">Mode</th>${ms.map((x) => `<th colspan="2" style="text-align:center">${esc(CT.monthLabel(x))}</th>`).join('')}</tr><tr>${ms.map(() => '<th>Target</th><th>Achieved</th>').join('')}</tr></thead><tbody>${scanRow('Goods issue', 'scanShip')}${scanRow('Goods receipt', 'scanRecv')}</tbody></table>
        <div style="height:34px"></div>
        <table class="t"><thead><tr><th class="l">Month</th><th>Approved STOs raised</th><th>Approved STRs raised</th><th>GIs received</th><th>GI receipt pending</th><th class="l">Pending at</th></tr></thead><tbody>${ms.map((x, i) => docRow(sums[i], x)).join('')}</tbody></table>
        <p class="note">STOs raised is entered in Monthly inputs (no export provided). STRs raised = transfer requests in the month excluding "Waiting for Approval".</p>`);
    }

    divider('div1', 'Branch KPIs', 'Performance snapshot', `Branch KPI scorecard, central warehouse, fill rate and fulfilment. ${esc(ML)} review, compared with ${esc(CT.monthLabel(pm, true))}.`);

    /* glance */
    const bt = (o.branches || []).filter((b) => b.total != null).sort((a, b) => b.total - a.total);
    {
      const pv = (k) => (P.branchTotals && P.branchTotals[k] != null ? P.branchTotals[k] : null);
      const top = bt[0]; const low = bt[bt.length - 1];
      const roleMonths = [-4, -3, -2, -1, 0].map((k) => CT.addMonths(m, k)).filter((x) => { const s = x === m ? cur : SO(x); return s.roleScores && Object.values(s.roleScores).some((r) => Object.keys(r).length); });
      const card = (lbl, big, smv) => `<div class="card"><div class="lbl">${lbl}</div><div class="big">${big}</div><div class="sm">${smv}</div></div>`;
      const body = !bt.length && !o.fill && !o.fulfil ? empty('scorecard data', 'Upload the monthly exports and enter stock accuracy and 5S scores in Monthly inputs.') :
        `<div class="cards" style="grid-template-columns:repeat(3,1fr)">
        ${card('TOP BRANCH (TOTAL)', top ? esc(top.name) : '—', top ? `${sc(top.total, 1)} / 100${pv(top.key) != null ? ` (${sc(pv(top.key), 1)} in ${PShort})` : ''}` : 'Awaiting inputs')}
        ${card('LOWEST BRANCH (TOTAL)', low ? esc(low.name) : '—', low ? `${sc(low.total, 1)} / 100${pv(low.key) != null ? ` (${sc(pv(low.key), 1)} in ${PShort})` : ''}` : 'Awaiting inputs')}
        ${card('CENTRAL WAREHOUSE', o.cfgs && o.cfgs.total != null ? sc(o.cfgs.total, 1) : '—', o.cfgs && o.cfgs.total != null && P.cfgsTotal != null ? `${moveTxt(o.cfgs.total, P.cfgsTotal, (v) => sc(v, 1))} in ${PShort}` : 'CFGS inputs pending')}
        ${card('OVERALL FILL RATE', o.fill ? pct(o.fill.total.rate) : '—', o.fill ? (P.fillByClass && P.fillByClass.ALL != null ? `vs ${pct(P.fillByClass.ALL)} in ${PShort}` : 'no prior month') + ` | line fill ${pct(o.fill.total.lineRate)}` : 'No fill-rate export')}
        ${card('OVERALL FULFILMENT', o.fulfil ? pct(o.fulfil.overall) : '—', o.fulfil && P.fulfilOverall != null ? `${moveTxt(o.fulfil.overall, P.fulfilOverall, (v) => pct(v))} in ${PShort}` : '')}
        ${card('TREND WINDOW', roleMonths.length ? `${CT.monthShort(roleMonths[0])} → ${MShort}` : '—', `${roleMonths.length && roleMonths[0].slice(0, 4) !== m.slice(0, 4) ? roleMonths[0].slice(0, 4) + '–' + m.slice(0, 4) : m.slice(0, 4)}, ${roleMonths.length} month${roleMonths.length === 1 ? '' : 's'} of employee scores`)}</div>`;
      std('glance', 'Branch KPIs', 'Review at a glance', 'OVERVIEW', `Review at a glance — ${MShort} vs ${PShort}`, '', body);
    }

    /* movers */
    {
      const mv = bt.filter((b) => P.branchTotals && P.branchTotals[b.key] != null).map((b) => ({ b, d: b.total - P.branchTotals[b.key], p: P.branchTotals[b.key] }));
      const gains = mv.filter((x) => x.d >= 0).sort((a, b) => b.d - a.d).slice(0, 3); const drops = mv.filter((x) => x.d < 0).sort((a, b) => a.d - b.d).slice(0, 3);
      const mcard = (x) => `<div class="mover"><div class="top"><span class="nm">${esc(x.b.name)}</span><span class="dl ${x.d >= 0 ? 'g' : 'r'}">${x.d >= 0 ? '+' : ''}${x.d.toFixed(1)}</span></div><div class="ln">${PShort}: ${sc(x.p, 1)} → ${MShort}: ${sc(x.b.total, 1)}</div><div class="ln">Stock: ${pct(x.b.stock)} &nbsp; 5S: ${pct(x.b.fiveS, 0)} &nbsp; Ship: ${pct(x.b.ship)} &nbsp; Recv: ${pct(x.b.recv)}</div></div>`;
      const body = !mv.length ? empty('month-on-month comparison', `Branch totals are needed for both ${esc(ML)} and ${esc(CT.monthLabel(pm, true))}.`) :
        `<div style="display:grid;grid-template-columns:1fr 1fr;gap:36px"><div><div class="s-kicker" style="color:${C.good}">BIGGEST GAINS</div>${gains.map(mcard).join('') || '<p>No branch improved.</p>'}</div><div><div class="s-kicker" style="color:${C.bad}">BIGGEST DROPS</div>${drops.map(mcard).join('') || '<p>No branch declined.</p>'}</div></div>${S.vacantRole !== 'full' && fromDeck(pm, 'branchTotals') ? `<p class="note">${esc(PS)} totals are taken from the ${esc(PS)} review deck, which gave full marks for vacant roles; ${esc(MS)} applies the current rule, so branches with a vacant role are not strictly comparable.</p>` : ''}`;
      std('movers', 'Branch KPIs', 'Biggest movers', 'KPI DASHBOARD', `Biggest movers — ${MShort} vs ${PShort}`, '', body);
    }

    /* branch totals chart */
    {
      const rows = bt.slice();
      const body = !rows.length ? empty('branch totals', 'Enter stock accuracy and 5S scores in Monthly inputs and upload the scan, goods issue and employee exports.') :
        vBars({ cats: rows.map((b) => b.name), series: [{ name: PShort, color: C.prev, values: rows.map((b) => (P.branchTotals ? P.branchTotals[b.key] : null)) }, { name: MShort, color: C.cur, values: rows.map((b) => b.total) }], h: 450, fmt: (v) => v.toFixed(0) }) + legend([{ name: CT.monthLabel(pm), color: C.prev }, { name: CT.monthLabel(m), color: C.cur }]);
      std('btotal', 'Branch KPIs', 'Branch total score', 'KPI DASHBOARD', `Branch total score — ${MShort} vs ${PShort}`, `Composite of stock accuracy, 5S, scan adherence, GR posting and role scores, weighted to 100.${rows.some((b) => b.rebased) ? ' Branches marked * have a vacant role; that component is excluded and the total re-based to 100.' : ''}`, body.replace(/(>)([^<]*?)(<\/text>)/g, (a, x, t, y) => { const b = rows.find((r) => r.name === t && r.rebased); return b ? x + t + '*' + y : a; }));
    }

    /* branch detail 1/2 and 2/2 */
    {
      const W = S.weights.branch;
      const miss = (b, f) => (b[f] == null ? '<span class="flag">enter</span>' : null);
      const d1 = table([
        { h: 'Branch', l: 1, f: (b) => `<b>${esc(b.name)}</b>` }, { h: 'Total', f: (b) => (b.total == null ? '—' : `<b>${sc(b.total)}</b>${b.rebased ? '*' : ''}`) },
        { h: 'Stock acc %', f: (b) => miss(b, 'stock') || pct(b.stock) }, { h: `Stock /${W.stock}`, f: (b) => sc(b.stockScore, 1) },
        { h: '5S %', f: (b) => miss(b, 'fiveS') || pct(b.fiveS) }, { h: `5S /${W.fiveS}`, f: (b) => sc(b.fiveSScore) },
        { h: 'Ship scan %', f: (b) => pct(b.ship), cls: (b) => cls3(b.ship, 0.95, 0.85) }, { h: `Ship /${W.ship}`, f: (b) => sc(b.shipScore) },
        { h: 'Recv scan %', f: (b) => pct(b.recv), cls: (b) => cls3(b.recv, 0.95, 0.85) }, { h: `Recv /${W.recv}`, f: (b) => sc(b.recvScore) }
      ], sortedBranches(o));
      std('bdet1', 'Branch KPIs', 'Branch KPI detail 1/2', 'KPI DASHBOARD', 'Branch KPI detail — stock, 5S and scan adherence (1/2)', `Stock accuracy scale: ${S.stockPts40[0]} pts (≥${S.stockBands[0] * 100}%), ${S.stockPts40[1]} (≥${S.stockBands[1] * 100}%), ${S.stockPts40[2]} (≥${S.stockBands[2] * 100}%), ${S.stockPts40[3]} (≥${S.stockBands[3] * 100}%), 0 below. 5S and scan scores are achieved % × weight.`, o.branches ? d1 : empty('branch data', ''));
      const roleCell = (b, k) => (b[k + 'Vacant'] ? `<span class="flag">vacant</span>` : pct(b[k]) + (k === 'acct' && b.acctFromScore ? '†' : ''));
      const d2 = table([
        { h: 'Branch', l: 1, f: (b) => `<b>${esc(b.name)}</b>` }, { h: 'Total', f: (b) => (b.total == null ? '—' : `<b>${sc(b.total)}</b>${b.rebased ? '*' : ''}`) },
        { h: 'GR pending', f: (b) => (b.grPending == null ? '—' : b.grPending + ' pending'), cls: (b) => (b.grPending ? 'r' : '') }, { h: `GR /${W.gr}`, f: (b) => sc(b.grScore, 1) },
        { h: 'Accountant %', f: (b) => roleCell(b, 'acct') }, { h: `Acct /${W.acct}`, f: (b) => sc(b.acctScore) },
        { h: 'Mixer %', f: (b) => roleCell(b, 'mixer'), cls: (b) => cls3(b.mixer, 0.85, 0.65) }, { h: `Mixer /${W.mixer}`, f: (b) => sc(b.mixerScore) },
        { h: 'Helper %', f: (b) => roleCell(b, 'helper') }, { h: `Helper /${W.helper}`, f: (b) => sc(b.helperScore) }
      ], sortedBranches(o));
      std('bdet2', 'Branch KPIs', 'Branch KPI detail 2/2', 'KPI DASHBOARD', 'Branch KPI detail — GR posting and role scores (2/2)', `GR month-end posting is pass/fail (${W.gr} pts if nothing pending). Role scores are the branch's combined accountant, mixer and helper SLA × weight. ${(o.branches || []).some((b) => b.acctFromScore) ? '† The foreman also works as accountant; that person\'s accountant score is used. ' : ''}${S.vacantRole === 'ignore' ? 'Vacant roles are excluded and the total re-based to 100 (*).' : ''}`, o.branches ? d2 : empty('branch data', ''));
    }

    /* CFGS */
    {
      const c = o.cfgs; const tot = c && c.total;
      const kp = c ? c.kpis : [];
      const rowsT = table([{ h: 'KPI', l: 1, f: (k) => `<b>${esc(k.label)}</b>` }, { h: 'Achieved', f: (k) => (k.isCount ? (k.achieved == null ? '—' : k.achieved + ' pending') : pct(k.achieved)) }, { h: 'Score', f: (k) => (k.score == null ? '<span class="flag">enter</span>' : `${sc(k.score, 1)} / ${k.max}`) }], kp);
      const bars = hBars({ rows: kp.map((k) => ({ label: k.label, values: [k.score == null ? null : (k.score / k.max) * 100], colors: [statusColor(k.score == null ? null : k.score / k.max, 0.9, 0.7)] })), series: [{ color: C.cur }], w: 700, rowH: 30, labelW: 250, fmt: (v) => v.toFixed(0) + '%' });
      const weakest = kp.filter((k) => k.score != null).map((k) => ({ ...k, r: k.score / k.max })).sort((a, b) => a.r - b.r)[0];
      const body = `<div style="display:grid;grid-template-columns:330px 1fr;gap:28px;height:100%"><div class="hero"><div class="lbl">${esc(MShort.toUpperCase())} TOTAL SCORE</div><div class="big">${tot == null ? '—' : sc(tot, 1)}</div><div class="sm" style="color:#86EFAC;font-weight:700">${tot != null && P.cfgsTotal != null ? `${tot - P.cfgsTotal >= 0 ? '+' : ''}${(tot - P.cfgsTotal).toFixed(1)} vs ${PShort} (${sc(P.cfgsTotal, 1)})` : ''}</div><div class="sm" style="margin-top:26px">${tot == null ? 'Enter CFGS stock accuracy, shrinkage and ABC stock-take adherence in Monthly inputs.' : `Weakest KPI: ${esc(weakest.label.toLowerCase())} at ${Math.round(weakest.r * 100)}% of its maximum.`}${o.scan && o.scan.scanRecv ? (() => { const r = o.scan.scanRecv.rows.find((x) => x.key === 'CFGS'); return r ? ` Receipt scans: ${r.c} fully completed and ${r.pc} partial of ${r.gt}.` : ''; })() : ''}</div></div><div>${rowsT}<div style="margin-top:16px;font-size:12px;font-weight:700;color:#1C1756">Score achieved as % of maximum</div>${bars}</div></div>`;
      std('cfgs', 'Central warehouse', 'CFGS scorecard', 'CENTRAL WAREHOUSE', `CFGS — standalone KPI scorecard, ${MShort} vs ${PShort}`, 'The Central FG Store has its own KPI structure and is shown separately rather than ranked against branches.', body);
    }

    /* fill rate */
    {
      const f = o.fill;
      const cl = f ? Object.keys(f.byClass).sort() : [];
      const body = !f ? empty('fill-rate export', 'Upload the "Stock Transfer Item Wise" export (columns include Classification, Requested and Received).') :
        `<div style="display:grid;grid-template-columns:300px 1fr;gap:28px;height:100%"><div class="hero"><div class="lbl">${esc(MShort.toUpperCase())} OVERALL FILL RATE</div><div class="big">${pct(f.total.rate)}</div><div class="sm">${int(f.total.rec)} received of ${int(f.total.req)} requested</div>${P.fillByClass && P.fillByClass.ALL != null ? `<div class="sm" style="margin-top:12px;color:#FDBA74;font-weight:700">${((f.total.rate - P.fillByClass.ALL) * 100 >= 0 ? '+' : '') + ((f.total.rate - P.fillByClass.ALL) * 100).toFixed(1)} pts vs ${PShort} (${pct(P.fillByClass.ALL)})</div>` : ''}<div class="sm" style="margin-top:22px;border-top:1px solid #3B3490;padding-top:14px">Line fill rate: ${pct(f.total.lineRate)} of ${int(f.total.lines)} lines fully received.<br><br>Quantities are summed across ${f.uomCount} units of measure; the 10 largest lines are ${pct(f.top10Share, 0)} of requested quantity.</div></div>
        <div><div style="display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start"><div>${vBars({ cats: cl.map((c) => (c === 'U' ? 'Unclassified' : 'Class ' + c)), series: [{ color: C.prev, values: cl.map((c) => (P.fillByClass && P.fillByClass[c] != null ? P.fillByClass[c] * 100 : null)) }, { color: C.cur, values: cl.map((c) => f.byClass[c].rate * 100) }], w: 440, h: 300, fmt: (v) => v.toFixed(1) + '%' })}${legend([{ name: CT.monthLabel(pm), color: C.prev }, { name: CT.monthLabel(m), color: C.cur }])}</div>
        <div>${table([{ h: 'Class', l: 1, f: (r) => `<b>${r.c === 'U' ? 'Unclassified' : r.c}</b>` }, { h: `Req (${MShort})`, f: (r) => int(r.v.req) }, { h: `Recv (${MShort})`, f: (r) => int(r.v.rec) }, { h: `${MShort} %`, f: (r) => pct(r.v.rate), cls: (r) => cls3(r.v.rate, 0.6, 0.45) }, { h: `${PShort} %`, f: (r) => (P.fillByClass ? pct(P.fillByClass[r.c === 'Total' ? 'ALL' : r.c]) : '—') }, { h: 'Line fill', f: (r) => pct(r.v.lineRate) }], cl.map((c) => ({ c, v: f.byClass[c] })).concat([{ c: 'Total', v: f.total, _cls: 'tot' }]).map((r) => (r.c === 'Total' ? { ...r, c: 'Total', _cls: 'tot', v: { ...r.v } } : r)).map((r) => (r.c === 'Total' ? Object.assign(r, { c: 'Total' }) : r)))}
        <p class="note">Largest lines: ${f.topLines.slice(0, 3).map((l) => `${esc(tc(l.item))} → ${esc(l.dest)} (${int(l.req)} ${esc(l.uom)}, ${int(l.rec)} received)`).join('; ')}.</p></div></div></div></div>`;
      const fb = o.fillBasis === 'abc' ? `Transfers from CFGS, classed by the company ABC (sales revenue, 12 months to ${esc(CT.monthLabel(o.fillAbcMonth))})${f && f.hasClass === false ? '' : `; ${int(o.fillReclassed)} lines changed class from the ERP export`}.` : f ? (f.hasClass === false ? 'Transfers from CFGS; no classification available (upload the 12-month sales file for ABC classes).' : 'Transfers from CFGS, classed by the Classification column in the ERP export.') : '';
      const fbPrev = f && P.fillBasis && P.fillBasis !== (o.fillBasis === 'abc' ? 'abc:' + o.fillAbcMonth : 'export') ? ` ${esc(PShort)} used a different class basis, so compare the class rates with care.` : '';
      std('fill', 'Fill rate & fulfilment', 'Fill rate', 'FILL RATE', `Requested vs received — ${MShort} vs ${PShort}`, fb + fbPrev, body);
    }

    /* fulfilment */
    {
      const f = o.fulfil;
      const trendMonths = [-3, -2, -1, 0].map((k) => CT.addMonths(m, k));
      const tSums = trendMonths.map((x) => (x === m ? cur : SO(x)));

  function exitMonthOptions(sel) {
    const today = new Date(); const cal = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0');

    for (let k = 0; k < 24; k++) { const x = CT.addMonths(top, -k); out.push(`<option value="${x}" ${x === sel ? 'selected' : ''}>${CT.monthLabel(x)}</option>`); }
    if (sel && !out.some((o) => o.includes(`value="${sel}"`))) out.push(`<option value="${sel}" selected>${CT.monthLabel(sel)}</option>`);
    return out.join('');
  }

      <table class="ft" id="mTable"><thead><tr><th>Employee</th><th>Branch</th><th>Foreman</th><th>Accountant</th><th>Mixer</th><th>Helper</th><th>Status</th><th>Last working month</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>`;
